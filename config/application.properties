# Minimal local configuration for the Govaryn Kernel

govaryn.kernel.id="local-kernel"
govaryn.kernel.environment=DEV

# Spring Boot Actuator configuration
management.endpoints.web.exposure.include=health,info,metrics,env,configprops
management.endpoint.health.show-details=always

# Reserved for future extension.
# Supported today: classpath
# Planned later: plugin-folder
# govaryn.kernel.module.mode=classpath
