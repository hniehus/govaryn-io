# Minimal local configuration for the Govaryn Kernel

govaryn.kernel.id=local-kernel
govaryn.kernel.environment=DEV

# PostgreSQL runtime configuration (externalized via environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate PostgreSQL configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

# Spring Boot Actuator configuration
management.endpoints.web.exposure.include=health,info,metrics,env,configprops
management.endpoint.health.show-details=always

# Reserved for future extension.
# Supported today: classpath
# Planned later: plugin-folder
# govaryn.kernel.module.mode=classpath
